<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giblet Runs for It — a turkey escape game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a10; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Giblet Runs for It: run the turkey from the farmyard through the barn and kitchen, dodge the oven and the carving knife, and slip out the back door before the farmer catches you"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
